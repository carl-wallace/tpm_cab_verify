[package]
name = "tpm_cab_verify"
version = "0.1.2"
edition = "2021"

[dependencies]
cms = "0.3.0-pre.2"
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.1", features = ["alloc", "derive", "oid", "pem"] }
x509-cert = "0.3.0"
x509-tsp = "0.2.0-pre"

certval = { git = "https://github.com/carl-wallace/rust-pki.git", features = ["std", "webpki", "rsa"], branch = "main"}

sha2 = "0.11.0"

authenticode = "0.6.0"
bincode = { version = "2.0", features = ["serde"] }
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.4", features = ["full", "time", "rt-multi-thread"]}

[patch.crates-io]
# The formats 0.3-pre line isn't on crates.io yet and is internally git-coupled
# (x509-tsp -> cmpv2 pins the whole stack), so keep all of formats on git.
# Everything else (hashes, curves, RSA, signatures, crypto-bigint) now resolves
# from crates.io stable and no longer needs a patch.
cmpv2        = { git = "https://github.com/RustCrypto/formats.git" }
cms          = { git = "https://github.com/RustCrypto/formats.git" }
crmf         = { git = "https://github.com/RustCrypto/formats.git" }
pkcs1        = { git = "https://github.com/RustCrypto/formats.git" }
x509-ocsp    = { git = "https://github.com/RustCrypto/formats.git" }
x509-tsp     = { git = "https://github.com/RustCrypto/formats.git" }

authenticode = {git = "https://github.com/carl-wallace/authenticode-rs.git", branch = "updates"}
